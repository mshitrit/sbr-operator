apiVersion: operators.coreos.com/v1alpha1
kind: ClusterServiceVersion
metadata:
  annotations:
    alm-examples: '[]'
    capabilities: Basic Install
    createdAt: "2025-11-17T11:34:42Z"
    operators.operatorframework.io/builder: operator-sdk-v1.33.0
    operators.operatorframework.io/project_layout: go.kubebuilder.io/v4
    containerImage: quay.io/medik8s/sbd-operator:latest
  name: sbd-operator.v0.0.1
  namespace: placeholder
spec:
  apiservicedefinitions: {}
  customresourcedefinitions:
    owned:
      - description: SBDConfig is the Schema for the sbdconfigs API.
        displayName: SBDConfig
        kind: SBDConfig
        name: sbdconfigs.medik8s.medik8s.io
        version: v1alpha1
      - description: SBDRemediation is the Schema for the sbdremediations API.
        displayName: SBDRemediation
        kind: SBDRemediation
        name: sbdremediations.medik8s.medik8s.io
        version: v1alpha1
      - description: SBDRemediationTemplate is the Schema for the sbdremediationtemplates API.
        displayName: SBDRemediation Template
        kind: SBDRemediationTemplate
        name: sbdremediationtemplates.medik8s.medik8s.io
        version: v1alpha1
  description: TBD
  displayName: SBD
  icon:
    - base64data: "iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mP8/wwAAgMBgS+0L8sAAAAASUVORK5CYII="
      mediatype: "image/png"
  install:
    spec:
      deployments:
        - label:
            app.kubernetes.io/managed-by: kustomize
            app.kubernetes.io/name: sbd-operator
            control-plane: controller-manager
          name: sbd-operator-controller-manager
          spec:
            replicas: 1
            selector:
              matchLabels:
                app.kubernetes.io/name: sbd-operator
                control-plane: controller-manager
            strategy: {}
            template:
              metadata:
                annotations:
                  kubectl.kubernetes.io/default-container: manager
                labels:
                  app.kubernetes.io/name: sbd-operator
                  control-plane: controller-manager
              spec:
                containers:
                  - args:
                      - --metrics-bind-address=:8443
                      - --leader-elect
                      - --health-probe-bind-address=:8081
                    command:
                      - /manager
                    env:
                      - name: POD_NAME
                        valueFrom:
                          fieldRef:
                            fieldPath: metadata.name
                      - name: POD_NAMESPACE
                        valueFrom:
                          fieldRef:
                            fieldPath: metadata.namespace
                    image: quay.io/medik8s/sbd-operator:latest
                    livenessProbe:
                      httpGet:
                        path: /healthz
                        port: 8081
                      initialDelaySeconds: 15
                      periodSeconds: 20
                    name: manager
                    ports:
                      - containerPort: 9443
                        name: webhook-server
                        protocol: TCP
                    readinessProbe:
                      httpGet:
                        path: /readyz
                        port: 8081
                      initialDelaySeconds: 5
                      periodSeconds: 10
                    resources:
                      limits:
                        cpu: 500m
                        memory: 128Mi
                      requests:
                        cpu: 10m
                        memory: 64Mi
                    securityContext:
                      allowPrivilegeEscalation: false
                      capabilities:
                        drop:
                          - ALL
                    volumeMounts:
                      - mountPath: /tmp/k8s-webhook-server/serving-certs
                        name: cert
                        readOnly: true
                securityContext:
                  runAsNonRoot: true
                  seccompProfile:
                    type: RuntimeDefault
                serviceAccountName: controller-manager
                terminationGracePeriodSeconds: 10
                volumes:
                  - name: cert
                    secret:
                      defaultMode: 420
                      secretName: webhook-server-certs
    strategy: deployment
  installModes:
    - supported: false
      type: OwnNamespace
    - supported: false
      type: SingleNamespace
    - supported: false
      type: MultiNamespace
    - supported: true
      type: AllNamespaces
  keywords:
    - sbd
    - storage
    - remediation
  links:
    - name: SBD Operator
      url: https://medik8s.io
  maintainers:
    - email: medik8s@googlegroups.com
      name: Medik8s Team
  maturity: alpha
  provider:
    name: medik8s
  version: 0.0.1
  webhookdefinitions:
    - admissionReviewVersions:
        - v1
      containerPort: 443
      deploymentName: sbd-operator-controller-manager
      failurePolicy: Fail
      generateName: vsbdconfig.kb.io
      rules:
        - apiGroups:
            - medik8s.medik8s.io
          apiVersions:
            - v1alpha1
          operations:
            - CREATE
            - UPDATE
          resources:
            - sbdconfigs
      sideEffects: None
      targetPort: 9443
      type: ValidatingAdmissionWebhook
      webhookPath: /validate-medik8s-medik8s-io-v1alpha1-sbdconfig
  minKubeVersion: 1.26.0
